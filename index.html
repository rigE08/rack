<!DOCTYPE html>
<html lang="ro"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Rack Configurator</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;background:#0f172a;color:#e5e7eb}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;background:#1e293b}
input,select,button{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid #475569;background:#0f172a;color:#e5e7eb}
button{cursor:pointer}button:hover{background:#334155}.pri{background:#2563eb;border-color:#2563eb}.red{background:#b91c1c;border-color:#b91c1c}
#name{font-weight:600;width:200px}
.wrap{display:flex;flex-wrap:wrap;gap:12px;padding:10px}
aside{width:210px}aside h4{margin:6px 0}
.lib{padding:6px 8px;margin:4px 0;background:#1e293b;border-left:5px solid;border-radius:4px;cursor:grab;font-size:13px}
.lib small{color:#94a3b8}
main{flex:1;min-width:320px}
.tabs button.on{background:#334155}
#power{margin:8px 0;padding:8px;border-radius:6px;background:#1e293b}
#rackbox{overflow:auto;max-width:100%}
#rack{position:relative;width:560px;border:3px solid #64748b;background:#111827;user-select:none}
.slot{display:flex;align-items:center;border-bottom:1px solid #1f2937;font-size:10px;color:#64748b;padding-left:4px}
.dev,#ghost{position:absolute;left:30px;right:4px}
.dev{background:#1f2937;border:1px solid #475569;border-left:6px solid;border-radius:3px;padding:1px 4px;display:flex;flex-direction:column;overflow:hidden;cursor:pointer}
.dn{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:12px}.dn small{color:#94a3b8}
.pg{display:grid;grid-auto-flow:column;gap:2px;flex:1;margin:2px 0}
.p{display:block;border:1px solid #000;border-radius:2px;min-width:5px;cursor:pointer}.p:hover{outline:2px solid #fff}
#ghost{display:none;border:2px dashed;pointer-events:none;z-index:5}
#ghost.ok{background:#22c55e55;border-color:#22c55e}#ghost.bad{background:#ef444477;border-color:#ef4444}
.leg span{display:inline-block;margin-right:10px;font-size:12px}.leg i{display:inline-block;width:10px;height:10px;margin-right:3px;border:1px solid #000}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{border:1px solid #334155;padding:4px 6px;text-align:left}th{background:#1e293b}
.free{color:#22c55e;font-weight:700}
dialog{background:#1e293b;color:#e5e7eb;border:1px solid #475569;border-radius:10px;width:min(380px,92vw)}
dialog::backdrop{background:#0009}dialog label{display:block;margin:6px 0;font-size:12px;color:#94a3b8}
dialog input,dialog select{width:100%;margin-top:2px}.btns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
aside{width:230px}#libs{max-height:62vh;overflow:auto}#q{width:100%;margin-bottom:6px}
details{margin:4px 0}summary{cursor:pointer;padding:5px 6px;background:#1e293b;border-radius:4px;font-weight:600;font-size:13px}
summary small{color:#94a3b8;font-weight:400}.lib.sel{outline:2px solid #facc15}
.add{float:right;color:#22c55e;padding:0 4px}.rm{float:right;color:#ef4444;padding:0 4px}
#hint{display:none;margin:6px 0;padding:6px 8px;background:#854d0e;border-radius:6px}.tabs{margin-bottom:6px}
#vCatv tr[data-c]{cursor:pointer}#vCatv tr[data-c]:hover{background:#1e293b}
.p{touch-action:none}header button.on{background:#2563eb}
.dev{flex-direction:row;align-items:stretch;gap:6px;overflow:visible}
.dn{width:132px;flex:none;white-space:normal;line-height:11px;max-height:100%;overflow:hidden;align-self:center}.dev .dn:only-child{width:auto}
.pg{margin:2px 0}.p{position:relative}
.p.glow{z-index:3;box-shadow:0 0 0 2px var(--gc,#facc15),0 0 10px 4px var(--gc,#facc15);animation:pl .7s infinite alternate}
.p.tgt{z-index:3;box-shadow:0 0 0 2px #fff,0 0 12px 5px var(--gc,#22d3ee)}
.p.hl{z-index:3;box-shadow:0 0 0 2px #fff,0 0 10px 4px var(--gc,#fff)}
@keyframes pl{to{box-shadow:0 0 0 2px var(--gc,#facc15),0 0 18px 8px var(--gc,#facc15)}}
caption{text-align:left;font-weight:700;padding:12px 0 4px}td input,td select{width:100%;min-width:64px;padding:3px 5px;font-size:13px}td input.d{min-width:150px}td input.d::placeholder{color:#22c55e;font-weight:700;opacity:1}
.dd{white-space:nowrap}.dd input{width:calc(100% - 34px)}.pk{padding:2px 6px}
.lb{font-size:9px;color:#94a3b8;align-self:center;white-space:nowrap}.pin{flex:none;width:14px;height:14px;align-self:center;font-size:9px;line-height:14px;text-align:center;color:#000;font-style:normal;margin-left:4px}
.p.mm{display:flex;gap:1px;padding:1px}.p.mm b{flex:1;background:#0b0f19;border-radius:1px}
body.audit aside,body.audit .tabs,body.audit #power,body.audit .leg,body.audit header>*:not(.keep){display:none}
body.audit #rack{width:min(100%,1000px)}body.audit .dn{font-size:14px;line-height:15px;width:170px}
.p.ok{box-shadow:0 0 0 2px #fff,0 0 8px 3px #22c55e}.p.ok::after{content:'✓';position:absolute;left:0;right:0;top:0;bottom:0;font-size:11px;line-height:1;color:#fff;text-align:center;font-style:normal}
.p.sfp{border-color:#22d3ee}
.lpg{display:grid;background:#fff;color:#000;width:210mm;height:297mm;margin:0 0 12px;box-sizing:border-box;overflow:hidden}
.lab{border:1px dashed #bbb;border-left:4px solid var(--lc);padding:1mm 1.5mm;font:7.5pt/1.25 sans-serif;overflow:hidden;box-sizing:border-box}
#labSheet{overflow:auto}
@media print{body *{visibility:hidden}#labSheet,#labSheet *{visibility:visible}#labSheet{position:absolute;left:0;top:0;overflow:visible}.lpg{margin:0;page-break-after:always}.lab{border-color:#ddd}@page{size:A4;margin:0}}
</style></head><body>
<header>
 <input id="name" placeholder="Nume proiect">
 <select id="size" title="Dimensiune rack"></select>
 <button id="fr" class="on">Față</button><button id="rr">Spate</button> <button id="cn">Conectare cablu</button><select id="cc"></select><button id="cs" class="on">Cabluri</button><button id="png">Imagine rack</button> <button id="un" class="keep" title="Ctrl+Z">↶</button><button id="re" class="keep" title="Ctrl+Y">↷</button><button id="au" class="keep">Mod Audit</button><label style="font-size:12px"><input type="checkbox" id="vs" checked style="width:auto"> Validare patching</label>
 <button id="newp">Proiect nou</button>
 <button id="xl" class="pri">Export Excel</button><button id="pf" class="pri">Export PDF</button>
 <button id="sj">Salvează .json</button><button id="lj">Încarcă .json</button> <button id="nb">Vendor pack NetBox</button> <button id="lst">Listă echipamente</button>
 <input id="file" type="file" accept=".json" hidden>
</header>
<div class="wrap">
 <aside><h4>Librărie</h4><input id="q" placeholder="Caută echipament...">
  <small style="color:#94a3b8;display:block;margin-bottom:6px">Trage în rack, sau click pe echipament și apoi click pe U-ul dorit. ＋ = primul loc liber.</small>
  <div id="libs"></div><button id="cust" style="width:100%;margin-top:6px">+ Echipament personalizat</button></aside>
 <main>
  <div class="tabs"><button id="t1" class="on">Rack</button> <button id="t2">Live Cable Matrix</button> <button id="t3">CATV</button> <button id="t4">Topologie</button> <button id="t5">Etichete</button></div>
  <div id="power"></div><div id="hint"></div>
  <div id="vRack">
   <div class="leg"><span><i style="background:#22c55e"></i>Ocupat</span><span><i style="background:#9ca3af"></i>Liber</span><span><i style="background:#3b82f6"></i>Trunk</span><span><i style="background:#a855f7"></i>LACP</span><span><i style="background:#f59e0b"></i>Down</span><span><i style="background:#333"></i>Disabled</span></div>
   <div id="rackbox"><div id="rack"></div></div>
  </div>
  <div id="vMat" style="display:none;overflow:auto"><div style="display:flex;gap:6px;flex-wrap:wrap;margin:4px 0"><input id="mq" placeholder="Filtru echipament..." style="flex:1;min-width:140px"><button id="mo">Deschide tot</button><button id="mc">Închide tot</button></div>
 <small style="color:#94a3b8">Editezi direct în tabel (se salvează automat). 🔌 = alege portul altui echipament. Destinație goală = LIBER.</small><div id="mbody"></div></div><div id="vCatv" style="display:none;overflow:auto"></div>
  <div id="vTopo" style="display:none;overflow:auto"><label style="font-size:13px"><input type="checkbox" id="tp_pw" style="width:auto"> Arată și alimentarea (UPS / PDU)</label><div id="tbody" style="margin-top:6px"></div></div>
  <div id="vLab" style="display:none"><div style="display:flex;gap:6px;flex-wrap:wrap;margin:4px 0;align-items:center"><select id="lp"></select><select id="lf"></select><label style="font-size:13px"><input type="checkbox" id="lb" checked style="width:auto"> Etichetă pe ambele capete</label><button id="lpr" class="pri">Printează</button></div><div id="labSheet"></div></div>
 </main>
</div>
<dialog id="dlg"></dialog>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COL={Switch:'#2563eb',Router:'#7c3aed',Firewall:'#dc2626','NVR/DVR':'#0d9488',Server:'#64748b','Patch Panel':'#b45309',UPS:'#15803d',PDU:'#be185d','Tavă':'#9ca3af','Blank Panel':'#4b5563',Organizator:'#6b7280',ODF:'#eab308',CATV:'#f97316'};
const CABLE=['Albastru','Portocaliu','Galben','Verde','Roșu','Alb','Negru','Gri'];
const LIB=[
 {n:'Switch 24p',t:'Switch',u:1,p:24,w:40,pt:'RJ45'},{n:'Switch 48p PoE',t:'Switch',u:1,p:48,w:400,pt:'RJ45'},
 {n:'Switch SFP 8p',t:'Switch',u:1,p:8,w:30,pt:'SFP'},{n:'Router',t:'Router',u:1,p:8,w:30,pt:'RJ45'},
 {n:'Firewall',t:'Firewall',u:1,p:6,w:40,pt:'RJ45'},{n:'NVR 16 canale',t:'NVR/DVR',u:2,p:16,w:60,pt:'RJ45'},
 {n:'Server',t:'Server',u:2,p:4,w:300,pt:'RJ45'},{n:'Patch Panel 24p',t:'Patch Panel',u:1,p:24,w:0,pt:'RJ45'},
 {n:'UPS 1000W',t:'UPS',u:3,p:5,w:1000,pt:'Priză',ups:{ins:1,outs:4,grp:[]}},{n:'UPS 3000W (2 grupuri)',t:'UPS',u:3,p:7,w:3000,pt:'Priză',ups:{ins:1,outs:6,grp:[3,3]}},{n:'PDU 8 prize',t:'PDU',u:1,p:8,w:0,pt:'Priză'},
 {n:'Tavă',t:'Tavă',u:1,p:0,w:0,pt:'RJ45'},{n:'Blank Panel',t:'Blank Panel',u:1,p:0,w:0,pt:'RJ45'},{n:'Organizator cabluri 1U',t:'Organizator',u:1,p:0,w:0,pt:'RJ45'},{n:'Organizator cabluri 2U',t:'Organizator',u:2,p:0,w:0,pt:'RJ45'},
 {n:'ODF 12 fibre SC',t:'ODF',u:1,p:12,w:0,pt:'SC'},{n:'ODF 24 fibre LC',t:'ODF',u:1,p:24,w:0,pt:'LC'},{n:'ODF 48 fibre LC',t:'ODF',u:2,p:48,w:0,pt:'LC'},{n:'ODF 96 fibre LC',t:'ODF',u:4,p:96,w:0,pt:'LC'},
 {n:'Amplificator CATV',t:'CATV',u:1,p:4,w:15,pt:'F'},{n:'Multiswitch 9x16',t:'CATV',u:1,p:16,w:20,pt:'F'},{n:'Modulator CATV',t:'CATV',u:1,p:4,w:25,pt:'F'}];
let S=null;try{S=JSON.parse(localStorage.getItem('rackcfg'))}catch(e){}
S=S||{name:'Proiect nou',rackU:42,devs:[],catv:[],links:[],nid:1};
S.catv=S.catv||[];S.links=S.links||[];fixUps();let view='front',drag=null,tab=1;let H=26;
const HS={st:[],i:-1};
function persist(){try{localStorage.setItem('rackcfg',JSON.stringify(S))}catch(e){}}
function save(){persist();const j=JSON.stringify(S);if(HS.st[HS.i]===j)return;HS.st=HS.st.slice(0,HS.i+1);HS.st.push(j);if(HS.st.length>31)HS.st.shift();HS.i=HS.st.length-1}
function hist(d){const k=HS.i+d;if(k<0||k>=HS.st.length)return;HS.i=k;S=JSON.parse(HS.st[k]);conn.a=null;render()}

const fits=(pos,u,id)=>pos>=1&&pos+u-1<=S.rackU&&!S.devs.some(d=>d.id!==id&&d.pos<=pos+u-1&&pos<=d.pos+d.u-1);
const firstFree=u=>{for(let p=S.rackU-u+1;p>=1;p--)if(fits(p,u,-1))return p;return 0};
function mk(t,pos){const d={id:S.nid++,name:t.n,type:t.t,u:t.u,pos,p:t.p,w:t.w,pt:t.pt||'RJ45',pd:{},ptl:t.ptl,pn:t.pn,ups:t.ups?JSON.parse(JSON.stringify(t.ups)):undefined};if(d.ups)d.pd[1]={dest:'220V',status:'Up'};return d}
function add(t,pos){pos=pos||firstFree(t.u);if(!pos||!fits(pos,t.u,-1)){alert('Nu există spațiu liber de '+t.u+'U în rack.');return}S.devs.push(mk(t,pos));render()}

function pc(d,n){const x=d.pd[n]||{};
 if(x.status==='Disabled')return'#333';if(x.status==='Down')return'#f59e0b';
 if(x.mode==='Trunk')return'#3b82f6';if(x.mode==='LACP')return'#a855f7';
 return x.dest?'#22c55e':'#9ca3af'}

function renderRack(){
 let h='';for(let u=S.rackU;u>=1;u--)h+=`<div class="slot" style="height:${H}px">${u}</div>`;
 S.devs.forEach(d=>{
  let body='';
  const showP=view==='front'||d.type==='UPS'||d.type==='PDU';
  if(showP&&d.type==='UPS'&&d.ups){const u=d.ups,x1=d.pd[1]||{},port=n=>{const x=d.pd[n]||{};return `<i class="p" data-d="${d.id}" data-n="${n}" style="background:${pc(d,n)}" title="${esc(portLabel(d,n))}: ${esc(x.dest||'Liber')}"></i>`},
   grp=(a,b)=>`<div class="pg" style="grid-template-columns:repeat(${b-a+1},14px);grid-template-rows:1fr;flex:none">`+Array.from({length:b-a+1},(_,i)=>port(a+i)).join('')+'</div>';
   body=`<span class="lb">IN${x1.dest==='220V'?' 220V':''}</span>${grp(1,u.ins)}<span class="lb">OUT</span>`;let a=u.ins+1;const gs=u.grp&&u.grp.length?u.grp:[u.outs];
   gs.forEach((c,gi)=>{body+=(u.grp&&u.grp.length?`<span class="lb">G${gi+1}</span>`:'')+grp(a,a+c-1);a+=c})}
  else if(showP&&d.p>0){const rw=rowsOf(d),cols=Math.ceil(d.p/rw);
   body=`<div class="pg" style="grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${rw},1fr)">`;
   for(let n=1;n<=d.p;n++){const x=d.pd[n]||{};const mm=isMM(d,n);body+=`<i class="p${mm?' mm':''}${d.ptl&&ptOf(d,n)==='SFP'?' sfp':''}${x.ok?' ok':''}" data-d="${d.id}" data-n="${n}" style="background:${pc(d,n)}" title="${esc(portLabel(d,n))}${mm?' · MM duplex':''}: ${esc(x.dest||'Liber')}">${mm?'<b></b><b></b>':''}</i>`}
   body+='</div>'}
  if(powered(d)){const x0=d.pd[0]||{};body+=`<i class="p pin" data-d="${d.id}" data-n="0" style="background:${pc(d,0)}" title="alimentare: ${esc(x0.dest||'Liber')}">⚡</i>`}
  const extra=view==='rear'?` · ${d.w}W${d.type==='PDU'?' · '+d.p+' prize':''}`:'';
  h+=`<div class="dev" draggable="${!conn.on}" data-id="${d.id}" style="top:${(S.rackU-d.pos-d.u+1)*H}px;height:${d.u*H-2}px;border-left-color:${COL[d.type]||'#888'}"><div class="dn">${esc(d.name)} <small>U${d.pos}${d.u>1?'-U'+(d.pos+d.u-1):''}${extra}</small></div>${body}</div>`});
 h+='<div id="ghost"></div><svg id="cab" style="position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:4"></svg>';$('rack').innerHTML=h;drawCables()}

function renderPower(){
 const use=S.devs.filter(d=>d.type!=='UPS').reduce((a,d)=>a+d.w,0),ups=S.devs.filter(d=>d.type==='UPS').reduce((a,d)=>a+d.w,0);
 let msg=`Consum total: <b>${use} W</b> (≈ ${Math.round(use*3.412)} BTU/h)`;
 if(ups){const pc=Math.round(use/ups*100),c=pc>100?'#ef4444':pc>80?'#f59e0b':'#22c55e';
  msg+=` · UPS: ${ups} W · încărcare <b style="color:${c}">${pc}%</b>${pc>100?' – SUPRASOLICITAT':pc>80?' – aproape de limită':' – OK'}`}
 else msg+=' · niciun UPS în rack';
 $('power').innerHTML=msg}

const HEAD=['Echipament','Slot rack','Port','Tip port','VLAN','Destinație','Locație','Status','Cablu','Detalii'];
function rows(list){const r=[];[...(list||S.devs)].sort((a,b)=>b.pos-a.pos).forEach(d=>{const fib=d.type==='ODF'||d.pt==='SC'||d.pt==='LC',pp=['Patch Panel','UPS','PDU'].includes(d.type);
 for(let n=powered(d)?0:1;n<=d.p;n++){const x=d.pd[n]||{},z=n===0;
 const v=pp||z?'':x.mode&&x.mode!=='Access'?x.mode+(x.vlan?' '+x.vlan:''):(x.vlan||'');
 const det=fib?[x.fib&&x.fib.split(' ')[0],x.att&&x.att+' dB'].filter(Boolean).join(' · '):d.pt==='F'&&x.att?x.att+' dBµV':'';
 r.push([d.name,'U'+d.pos+(d.u>1?'-U'+(d.pos+d.u-1):''),z?'Alimentare':d.type==='UPS'||d.pn?portLabel(d,n):n,z?'Alimentare':ptOf(d,n),v,x.dest||'LIBER',x.loc||'',pp||z?'':x.dest?(x.status||'Up'):'-',x.dest?(x.color||''):'',x.dest&&!z?det:''])}});return r}
const MO=new Set();
function renderMat(){let h='';const q=$('mq').value.toLowerCase();
 [...S.devs].filter(d=>(d.p>0||powered(d))&&(!q||(d.name+' '+d.type).toLowerCase().includes(q))).sort((a,b)=>b.pos-a.pos).forEach(d=>{
  const fib=d.type==='ODF'||d.pt==='SC'||d.pt==='LC',rf=d.pt==='F',pp=d.type==='Patch Panel',pw=d.type==='UPS'||d.type==='PDU',sw=!fib&&!rf&&!pp&&!pw;
  const cols=['port',...(sw?['mode','vlan']:[]),'dest','loc',...(pp||pw?[]:['status']),'color',...(fib?['fib','att']:rf?['att']:[])];
  const HH={port:'Port',mode:'Mod',vlan:'VLAN',dest:'Destinație',loc:'Locație',status:'Status',color:'Cablu',fib:'Tip fibră',att:fib?'Atenuare dB':'Nivel dBµV'};
  const at=(n,f)=>`data-d="${d.id}" data-n="${n}" data-f="${f}"`;
  const sl=(n,f,v,o)=>{if(v&&!o.includes(v))o=[...o,v];return `<select ${at(n,f)}>${o.map(x=>`<option value="${x}"${x===v?' selected':''}>${x||'—'}</option>`).join('')}</select>`};
  const used=Object.entries(d.pd).filter(([k,x])=>k>0&&x.dest).length;
  h+=`<details data-i="${d.id}"${MO.has(d.id)?' open':''}><summary>${esc(d.name)} <small>· ${d.type} · U${d.pos}${d.u>1?'-U'+(d.pos+d.u-1):''} · ${used}/${d.p} porturi ocupate</small></summary><table><tr>${cols.map(k=>`<th>${HH[k]}</th>`).join('')}</tr>`;
  for(let n=powered(d)?0:1;n<=d.p;n++){const x=d.pd[n]||{};
   h+='<tr>'+cols.map(k=>k==='port'?`<td>${n===0?'Alimentare':d.type==='UPS'||d.pn?portLabel(d,n):n}</td>`:n===0&&['mode','vlan','status','att'].includes(k)?'<td></td>':k==='fib'?`<td>${sl(n,k,x.fib||'SM (monomod)',['SM (monomod)','MM (multimod)'])}</td>`:k==='mode'?`<td>${sl(n,k,x.mode||'Access',['Access','Trunk','LACP'])}</td>`:k==='status'?`<td>${sl(n,k,x.status||'Up',['Up','Down','Disabled'])}</td>`:k==='color'?`<td>${sl(n,k,x.color||'',['',...Object.keys(CAB)])}</td>`:
    k==='dest'?`<td class="dd"><input class="d" ${at(n,k)} value="${esc(x.dest||'')}" placeholder="LIBER"><button class="pk" data-d="${d.id}" data-n="${n}" title="Alege port din alt echipament">🔌</button></td>`:
    `<td><input ${at(n,k)} value="${esc(x[k]||'')}"></td>`).join('')+'</tr>'}
  h+='</table></details>'});
 $('mbody').innerHTML=h||'<p style="color:#94a3b8">Niciun echipament.</p>'}
$('mbody').addEventListener('toggle',e=>{const id=+e.target.dataset.i;if(id)e.target.open?MO.add(id):MO.delete(id)},true);
$('mq').oninput=renderMat;
$('mo').onclick=()=>{document.querySelectorAll('#mbody details').forEach(x=>MO.add(+x.dataset.i));renderMat()};
$('mc').onclick=()=>{MO.clear();renderMat()};

 const rd=()=>{if($('f_t').value!=='UPS')return null;return{ins:Math.max(1,+$('f_ins').value|0),outs:Math.max(1,+$('f_outs').value|0),grp:$('f_grp').value.split(',').map(x=>+x|0).filter(x=>x>0)}};
 dlg(isNew?'Echipament nou':'Editează echipament',
  fld('Nume / etichetă','f_n',d.name)+sel('Tip','f_t',Object.keys(COL),d.type)+fld('Dimensiune (U)','f_u',d.u,'number')+fld('Poziție (U de jos)','f_pos',d.pos,'number')+
  '<div id="f_std">'+fld('Număr porturi','f_p',d.p,'number')+sel('Tip port','f_pt',['RJ45','SFP','Priză','SC','LC','F'],d.pt)+'</div>'+
  '<div id="f_ups">'+fld('Număr intrări','f_ins',u0.ins,'number')+fld('Număr ieșiri','f_outs',u0.outs,'number')+fld('Grupuri ieșiri (ex. 2,2 = două grupuri de câte 2 ieșiri; gol = fără grupuri)','f_grp',(u0.grp||[]).join(','))+'</div>'+
  '<div id="f_wr">'+fld('Consum W (la UPS: capacitate W)','f_w',d.w,'number')+'</div><div id="f_fib">'+sel('Tip fibră pentru tot ODF-ul','f_fa',['— neschimbat —','SM (monomod)','MM (multimod)'],'— neschimbat —')+'</div>',
  ()=>{const u=Math.max(1,+$('f_u').value|0),pos=+$('f_pos').value|0,ups=rd();
   if(!fits(pos,u,d.id)){alert('Nu e loc: spațiul este ocupat sau depășește rack-ul.');return false}
   if(ups&&ups.grp.length&&ups.grp.reduce((a,b)=>a+b,0)!==ups.outs){alert('Suma grupurilor trebuie să fie egală cu numărul de ieșiri ('+ups.outs+').');return false}
   Object.assign(d,{name:$('f_n').value||'Echipament',type:$('f_t').value,u,pos,p:ups?ups.ins+ups.outs:Math.max(0,+$('f_p').value|0),pt:ups?'Priză':$('f_pt').value,w:NOPW.includes($('f_t').value)?0:+$('f_w').value||0,ups:ups||undefined});if($('f_t').value==='ODF'&&$('f_fa').value[0]!=='—')for(let k=1;k<=d.p;k++){d.pd[k]=d.pd[k]||{};d.pd[k].fib=$('f_fa').value}
   if(isNew)S.devs.push(d);
   if(d.ptl&&d.ptl.length!==d.p)delete d.ptl;if(d.pn&&d.pn.length!==d.p)delete d.pn;if(d.ups&&!d.pd[1])d.pd[1]={dest:'220V',status:'Up'};S.links=S.links.filter(l=>[l.a,l.b].every(([i,n])=>{const x=S.devs.find(z=>z.id==i);return x&&n<=x.p}));render()},
  (isNew?'':'<button id="del" class="red">Șterge</button>')+'<button id="tpl">Șablon</button>');
 const tg=()=>{const t=$('f_t').value,u=t==='UPS';$('f_wr').style.display=NOPW.includes(t)?'none':'';$('f_fib').style.display=t==='ODF'?'':'none';$('f_ups').style.display=u?'':'none';$('f_std').style.display=u?'none':''};$('f_t').onchange=tg;tg();
 if(!isNew)$('del').onclick=()=>{S.links=S.links.filter(l=>l.a[0]!==d.id&&l.b[0]!==d.id);S.devs=S.devs.filter(x=>x!==d);$('dlg').close();render()};
 $('tpl').onclick=()=>{const ups=rd();USR.push({n:$('f_n').value||'Șablon',t:$('f_t').value,u:Math.max(1,+$('f_u').value|0),p:ups?ups.ins+ups.outs:Math.max(0,+$('f_p').value|0),w:NOPW.includes($('f_t').value)?0:+$('f_w').value||0,pt:ups?'Priză':$('f_pt').value,ups:ups||undefined});try{localStorage.setItem('racktpl',JSON.stringify(USR))}catch(e){}renderLib();$('tpl').textContent='Salvat ✓'}}
function portModal(d,n){const x=d.pd[n]||{},L=linkOf(d.id,n),info=L?`<p>🔗 Conectat la <b>${esc(L.o.name)}</b> – ${portLabel(L.o,L.m)} <small>(${L.o.type})</small></p>`:'',fib=n>0&&(d.type==='ODF'||d.pt==='SC'||d.pt==='LC'),rf=n>0&&d.pt==='F',pp=d.type==='Patch Panel',pw=n===0||d.type==='UPS'||d.type==='PDU';

 if(L)$('dc').onclick=()=>{unlink(d.id,n);$('dlg').close();render()};

/* evenimente rack */
const R=$('rack');
R.onclick=e=>{if(audit){auditTap(e);return}if(conn.on&&e.target.closest('.p'))return;if(pick){placePick(e);return}const p=e.target.closest('.p'),dv=e.target.closest('.dev');
 if(p)portModal(S.devs.find(d=>d.id==p.dataset.d),+p.dataset.n);else if(dv)devModal(S.devs.find(d=>d.id==dv.dataset.id),false)};
R.ondragstart=e=>{const dv=e.target.closest('.dev');if(dv){drag={dev:S.devs.find(d=>d.id==dv.dataset.id)};e.dataTransfer.setData('text','x')}};
function target(e){if(!drag)return null;const u=drag.dev?drag.dev.u:drag.t.u,y=e.clientY-R.getBoundingClientRect().top-3;
 const top=S.rackU-Math.floor(y/H);return{pos:top-u+1,u}}
R.ondragover=e=>{const t=target(e);if(!t)return;e.preventDefault();const g=$('ghost');
 g.style.display='block';g.style.top=(S.rackU-t.pos-t.u+1)*H+'px';g.style.height=t.u*H-2+'px';
 g.className=fits(t.pos,t.u,drag.dev?drag.dev.id:-1)?'ok':'bad'};
R.ondrop=e=>{e.preventDefault();const t=target(e);if(!t)return;
 if(!fits(t.pos,t.u,drag.dev?drag.dev.id:-1)){const g=$('ghost');g.className='bad';alert('Spațiu insuficient: echipamentul de '+t.u+'U nu încape aici.');drag=null;renderRack();return}
 if(drag.dev)drag.dev.pos=t.pos;else S.devs.push(mk(drag.t,t.pos));drag=null;render()};
document.ondragend=()=>{drag=null;const g=$('ghost');if(g)g.style.display='none'};

/* librărie */
let USR=[],pick=null;try{USR=JSON.parse(localStorage.getItem('racktpl'))||[]}catch(e){}
const GRP={Switch:'Rețea',Router:'Rețea',Firewall:'Rețea','NVR/DVR':'Servere & înregistrare',Server:'Servere & înregistrare','Patch Panel':'Pasive (cupru)',ODF:'Fibră optică (ODF)','Tavă':'Pasive (cupru)','Blank Panel':'Pasive (cupru)',Organizator:'Pasive (cupru)',UPS:'Alimentare',PDU:'Alimentare',CATV:'CATV'};
const OG=new Set(['Rețea']),ALL=()=>[...LIB,...USR];
function renderLib(){const q=$('q').value.toLowerCase(),g={};
 ALL().forEach((t,i)=>{if(q&&!(t.n+t.t).toLowerCase().includes(q))return;const k=i>=LIB.length?(t.mf?'NetBox · '+t.mf:'Șabloanele mele'):(GRP[t.t]||'Altele');(g[k]=g[k]||[]).push([t,i])});
 $('libs').innerHTML=Object.keys(g).map(k=>`<details data-k="${k}"${q||OG.has(k)?' open':''}><summary>${k} <small>(${g[k].length})</small></summary>`+g[k].map(([t,i])=>`<div class="lib${pick===t?' sel':''}" draggable="true" data-i="${i}" style="border-left-color:${COL[t.t]}">${esc(t.n)} <small>${t.u}U${t.ups?' · '+t.ups.ins+' intr./'+t.ups.outs+' ieș.':t.p?' · '+t.p+(t.pt==='Priză'?' prize':t.pt==='SC'||t.pt==='LC'?' fibre':'p'):''}</small>${i>=LIB.length?'<b class="rm" title="Șterge șablon">×</b>':''}<b class="add" title="Adaugă în primul loc liber">＋</b></div>`).join('')+'</details>').join('')||'<small>Niciun rezultat</small>'}
$('libs').addEventListener('toggle',e=>{if(!$('q').value){e.target.open?OG.add(e.target.dataset.k):OG.delete(e.target.dataset.k)}},true);
function setPick(t){pick=t;const h=$('hint');
 if(t){h.style.display='block';h.innerHTML=`Plasează <b>${esc(t.n)}</b> (${t.u}U): click pe U-ul dorit în rack (U-ul ales = partea de sus a echipamentului). <button id="done">Gata</button>`;$('done').onclick=()=>setPick(null)}
 else{h.style.display='none';drag=null;const g=$('ghost');if(g)g.style.display='none'}renderLib()}
document.onkeydown=e=>{if(e.key==='Escape')setPick(null)};
function placePick(e){drag={t:pick};const t=target(e);if(!t)return;
 if(!fits(t.pos,t.u,-1)){alert('Nu încape aici: spațiu ocupat sau în afara rack-ului.');return}S.devs.push(mk(pick,t.pos));render()}
R.onmousemove=e=>{if(pick){drag={t:pick};R.ondragover(e)}};
$('libs').ondragstart=e=>{const el=e.target.closest('.lib');if(el){pick=null;$('hint').style.display='none';drag={t:ALL()[el.dataset.i]};e.dataTransfer.setData('text','x')}};
$('libs').onclick=e=>{const el=e.target.closest('.lib');if(!el)return;const i=+el.dataset.i,t=ALL()[i];
 if(e.target.classList.contains('rm')){USR.splice(i-LIB.length,1);try{localStorage.setItem('racktpl',JSON.stringify(USR))}catch(x){}renderLib();return}
 if(e.target.classList.contains('add')){add(t);return}setPick(pick===t?null:t)};

 S.catv.forEach(c=>{catvRows().filter(r=>r[0]===c.name).length;for(let k=1;k<=c.n;k++){const x=c.out[k]||{};
  const cells=[(k==1?`<button data-e="${c.id}">✎</button> `:'')+esc(c.name),esc(c.type+(c.gain?' ('+(c.gain>0?'+':'')+c.gain+' dB)':'')),esc(c.loc),esc(c.feed),k,x.dest?esc(x.dest):'<span class="free">LIBER</span>',x.lvl?x.lvl+' dBµV':'',esc(x.cab||c.cable)];

const CAB={Albastru:'#2563eb',Portocaliu:'#f97316',Galben:'#facc15',Verde:'#16a34a','Roșu':'#dc2626',Alb:'#f3f4f6',Negru:'#111827',Gri:'#9ca3af',Maro:'#92400e',Violet:'#7c3aed',Roz:'#ec4899',Turcoaz:'#14b8a6'};
let conn={on:false,a:null,from:null,moved:false},showCab=true;
$('cc').innerHTML=CABLE.map(x=>`<option>${x}</option>`).join('');
const linkOf=(id,n)=>{const l=S.links.find(l=>(l.a[0]==id&&l.a[1]==n)||(l.b[0]==id&&l.b[1]==n));if(!l)return null;

const STD=[0.25,0.5,1,1.5,2,3,5,7,10,15,20];
function linkInfo(l){const A=S.devs.find(x=>x.id==l.a[0]),B=S.devs.find(x=>x.id==l.b[0]);if(!A||!B)return null;
 const ca=pcls(A,l.a[1]),cb=pcls(B,l.b[1]),mid=d=>d.pos+d.u/2,du=Math.abs(mid(A)-mid(B)),lo=Math.min(A.pos,B.pos),hi=Math.max(A.pos+A.u,B.pos+B.u);
 const org=S.devs.some(o=>o.type==='Organizator'&&o.pos>=lo&&o.pos+o.u<=hi),est=du*0.04445+(org?0.4:0.8)+(A.id===B.id?0:0.2),rec=STD.find(x=>x>=est)||Math.ceil(est);let tip;
 if(ca==='pw'||cb==='pw')tip='Cablu alimentare (IEC C13–C14)';else if(ca==='cu'&&cb==='cu')tip='Patch cord Cat6 UTP';
 else if(ca==='rf'||cb==='rf')tip='Cablu coaxial RG6 cu conectori F';else if(ca==='sfp'&&cb==='sfp')tip='Cablu DAC / AOC SFP';

function addBom(wb){const L=S.links.map(linkInfo).filter(Boolean);

const NB_RAW='https://raw.githubusercontent.com/netbox-community/devicetype-library/master/',NB_API='https://api.github.com/repos/netbox-community/devicetype-library/git/trees/master?recursive=1';
let NBX=null;
async function nbIndex(){if(NBX)return NBX;try{const c=JSON.parse(localStorage.getItem('nbidx')||'null');if(c&&c.t>Date.now()-6048e5&&c.p.length)return NBX=c.p}catch(e){}
 const r=await fetch(NB_API);if(!r.ok)throw new Error('GitHub '+r.status);const j=await r.json();NBX=j.tree.filter(x=>/^device-types\/.+\.ya?ml$/i.test(x.path)).map(x=>x.path);
 try{localStorage.setItem('nbidx',JSON.stringify({t:Date.now(),p:NBX}))}catch(e){}return NBX}
function nbParse(t){try{return window.jsyaml?jsyaml.load(t):JSON.parse(t)}catch(e){try{return JSON.parse(t)}catch(_){return null}}}
function nbMap(o){const mf=String(o.manufacturer||'').trim(),model=String(o.model||o.part_number||'Device').trim(),nm=(mf+' '+model).toLowerCase();
 const ifs=o.interfaces||[],fp=o['front-ports']||[],po=o['power-ports']||[],ou=o['power-outlets']||[];
 const it=i=>{const t=String(i.type||'').toLowerCase();if(/virtual|lag|bridge|other/.test(t)&&!/base/.test(t))return null;
  return/base-t|base-tx/.test(t)?'RJ45':/sfp|xfp|gbic|cfp|osfp|base-x|base-[sler]r|base-cr|base-cx|base-zr/.test(t)?'SFP':'RJ45'};
 const ci=ifs.filter(i=>!i.mgmt_only&&it(i)),w=Math.round(po.reduce((a,x)=>a+(+x.maximum_draw||+x.allocated_draw||0),0)),u=Math.max(1,Math.ceil(+o.u_height||1));
 let t,p,pt='RJ45',ptl,pn,ups;
 if(ou.length&&!ci.length&&!fp.length){if(/ups|smart-ups|back-ups|srt|online|vfi/.test(nm)){t='UPS';ups={ins:Math.max(1,po.length),outs:ou.length,grp:[]};p=ups.ins+ups.outs}else{t='PDU';p=ou.length}pt='Priză'}
 else if(!ci.length&&fp.length){const f=fp.map(x=>String(x.type||'').toLowerCase()),fiber=f.some(x=>/^(lc|sc|st|fc|mpo|mtrj|e2000)/.test(x));
  t=fiber?'ODF':'Patch Panel';p=fp.length;pt=fiber?(f.some(x=>x.startsWith('sc'))&&!f.some(x=>x.startsWith('lc'))?'SC':'LC'):'RJ45'}
 else{t=/firewall|fortigate|asa|pa-\d|usg|firepower|ngfw|srx/.test(nm)?'Firewall':/router|ccr|isr|asr|rb\d/.test(nm)?'Router':/nvr|dvr|ds-7/.test(nm)?'NVR/DVR':/server|poweredge|proliant/.test(nm)?'Server':'Switch';
  p=ci.length;const tl=ci.map(it);pt=tl.filter(x=>x==='SFP').length>p/2?'SFP':'RJ45';if(tl.some(x=>x!==pt))ptl=tl;const nn=ci.map(i=>String(i.name||''));if(nn.some(Boolean))pn=nn}
 return{n:(mf?mf+' ':'')+model,t,u,p,w:NOPW.includes(t)?0:w,pt,ptl,pn,ups,mf}}
function nbLib(t){if(!USR.some(x=>x.n===t.n&&x.mf===t.mf))USR.push(t);try{localStorage.setItem('racktpl',JSON.stringify(USR))}catch(e){}renderLib()}
async function nbGet(path){const r=await fetch(NB_RAW+encodeURI(path));if(!r.ok)throw new Error(r.status);const o=nbParse(await r.text());if(!o||!o.model)throw new Error('format necunoscut');return nbMap(o)}
$('nb').onclick=()=>{dlg('Vendor pack NetBox',`<p style="color:#94a3b8;font-size:12px">Caută în NetBox devicetype-library (GitHub), sau încarcă fișiere device-type (.yaml / .yml / .json). Șabloanele apar în librărie, grupate pe producător, cu porturile și numele lor reale.</p>

   catch(x){r.textContent='Nu s-a putut încărca indexul NetBox ('+x.message+'). Verifică internetul sau folosește încărcarea de fișiere.'}},350)};
 $('nb_r').onclick=async e=>{const b=e.target.closest('button');if(!b)return;const path=b.closest('[data-p]').dataset.p,st=$('nb_s');st.textContent='Se descarcă…';

function doXlsx(sel){const wb=XLSX.utils.book_new();

function importList(arr,replace,toLib){
 if(replace&&!confirm('Ștergi echipamentele și cablurile existente și le înlocuiești cu lista încărcată?'))return;
 if(replace){S.devs=[];S.links=[]}
 const typ=Object.keys(COL),PT=['RJ45','SFP','Priză','SC','LC','F'],DP={ODF:'LC',UPS:'Priză',PDU:'Priză',CATV:'F'};let add=0,skip=0,bad=0;
 arr.forEach(r0=>{const r={};Object.keys(r0).forEach(k=>r[norm(k)]=r0[k]);const name=String(r.nume||r.name||'').trim();if(!name)return;
  let t=typ.find(x=>norm(x)===norm(r.tip||r.type));if(!t){bad++;t='Switch'}
  const u=Math.max(1,parseInt(r.u)||1);let ups,p=Math.max(0,parseInt(r.porturi)||0),w=NOPW.includes(t)?0:(parseFloat(r['consum w']||r.consum)||0);
  let pt=PT.find(x=>norm(x)===norm(r['tip port']))||DP[t]||'RJ45';
  if(t==='UPS'){const ins=Math.max(1,parseInt(r['intrari ups'])||1),outs=Math.max(1,parseInt(r['iesiri ups'])||4);let grp=String(r['grupuri ups']||'').split(',').map(x=>parseInt(x)||0).filter(x=>x>0);
   if(grp.length&&grp.reduce((a,b)=>a+b,0)!==outs)grp=[];ups={ins,outs,grp};p=ins+outs;pt='Priză'}
  let pos=parseInt(r.pozitie)||0;if(!(pos&&fits(pos,u,-1)))pos=firstFree(u);if(!pos){skip++;return}
  const d={id:S.nid++,name,type:t,u,pos,p,w,pt,pd:{},ups};if(ups)d.pd[1]={dest:'220V',status:'Up'};S.devs.push(d);add++;
  if(toLib)USR.push({n:name,t,u,p,w,pt,ups})});
 if(toLib){try{localStorage.setItem('racktpl',JSON.stringify(USR))}catch(e){}renderLib()}
 render();alert(`Echipamente adăugate: ${add}`+(skip?`\nNu au încăput în rack: ${skip}`:'')+(bad?`\nTip necunoscut (puse ca Switch): ${bad}`:''))}
